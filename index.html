<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Habit Tracker (Synced)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --complete-bg: #fef9c3;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    select, button, input.sync-input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      background: white;
      color: var(--text);
    }

    button, select {
      cursor: pointer;
    }

    select:focus, input.sync-input:focus {
      outline: 2px solid var(--primary);
    }

    button.reset-btn {
      color: #ef4444;
      border-color: #fecaca;
    }

    button.reset-btn:hover {
      background: #fef2f2;
    }

    .sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 0.85rem;
    }

    .sync-status {
      font-weight: 600;
      color: #0f766e;
    }

    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
      font-size: 0.9rem;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 8px 4px;
      min-width: 32px;
    }

    th {
      background-color: #f1f5f9;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 1;
      vertical-align: middle;
    }

    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      background-color: #f8fafc;
      font-weight: bold;
      min-width: 75px;
      z-index: 2;
    }

    .habit-input {
      width: 105px;
      border: none;
      background: transparent;
      text-align: center;
      font-weight: 600;
      font-size: 0.82rem;
      line-height: 1.25;
      color: var(--text);
      padding: 4px;
      border-radius: 4px;
    }

    .habit-input:focus {
      outline: 2px solid var(--primary);
      background: white;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
      vertical-align: middle;
    }

    .status-col {
      min-width: 60px;
      font-size: 1.3rem;
      background-color: #fafafa;
    }

    tr.completed-row {
      background-color: var(--complete-bg);
      transition: background-color 0.3s ease;
    }

    tr.completed-row td:first-child {
      background-color: #fef08a;
    }

    .emoji-pop {
      display: inline-block;
      animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pop {
      0% { transform: scale(0); }
      80% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .guide {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>📅 Monthly 10-Habit Tracker</h1>
    <div class="controls">
      <select id="monthSelect" aria-label="Month"></select>
      <select id="yearSelect" aria-label="Year"></select>
      <button class="reset-btn" onclick="resetCurrentMonth()">Reset Month</button>
    </div>
  </header>

  <div class="sync-bar">
    <div>
      <label for="syncKeyInput"><b>Sync Key:</b></label>
      <input type="text" id="syncKeyInput" class="sync-input" placeholder="e.g. my-secret-key-123" style="width: 190px;">
      <button onclick="applySyncKey()">Connect & Sync</button>
    </div>
    <span id="syncStatus" class="sync-status">Local mode (enter a Sync Key to sync across devices)</span>
  </div>

  <div class="table-wrapper">
    <table id="trackerTable">
      <thead>
        <tr id="headerRow">
          <th>Date</th>
          <th class="status-col">Done</th>
        </tr>
      </thead>
      <tbody id="trackerBody"></tbody>
    </table>
  </div>

  <p class="guide">💡 Use the <b>same Sync Key</b> on your iPad and phone to keep habits and checkmarks synced.</p>
</div>

<script type="module">
  // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyADPGN9Hn2n5gZ5Ww_YAy-k1-UHi_-fz7M",
  authDomain: "godlife-5c3f5.firebaseapp.com",
  databaseURL: "https://godlife-5c3f5-default-rtdb.firebaseio.com",
  projectId: "godlife-5c3f5",
  storageBucket: "godlife-5c3f5.firebasestorage.app",
  messagingSenderId: "737203853234",
  appId: "1:737203853234:web:8d98f0ab857976e074f6ab",
  measurementId: "G-B7D5FS7645"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);

  const HABIT_COUNT = 10;
  const DEFAULT_HABITS = [
    "Running & Home Workout",
    "Foreign Language Listening & Reading",
    "EEA",
    "30 Chinese Words",
    "No Snacks",
    "World Studies",
    "Read 10m",
    "Memorize 3 Cube Algorithms",
    "Craftsman Information Processing",
    "Drink Water"
  ];
  const CELEBRATION_EMOJIS = ["🎉", "🔥", "🏆", "🥳", "🌟", "💯", "👑", "✨"];
  const MONTH_NAMES = [
    "January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"
  ];

  const monthSelect = document.getElementById("monthSelect");
  const yearSelect = document.getElementById("yearSelect");
  const syncKeyInput = document.getElementById("syncKeyInput");
  const syncStatus = document.getElementById("syncStatus");
  const headerRow = document.getElementById("headerRow");
  const trackerBody = document.getElementById("trackerBody");

  let currentSyncKey = localStorage.getItem("habitSyncKey") || "";
  syncKeyInput.value = currentSyncKey;

  let unsubscribeHabits = null;
  let unsubscribeMonth = null;

  function setStatus(msg, isError = false) {
    syncStatus.textContent = msg;
    syncStatus.style.color = isError ? "#dc2626" : "#0f766e";
  }

  function initMonthSelectors() {
    const now = new Date();
    const currentYear = now.getFullYear();
    const currentMonth = String(now.getMonth() + 1).padStart(2, "0");

    MONTH_NAMES.forEach((name, idx) => {
      const opt = document.createElement("option");
      const val = String(idx + 1).padStart(2, "0");
      opt.value = val;
      opt.textContent = name;
      if (val === currentMonth) opt.selected = true;
      monthSelect.appendChild(opt);
    });

    for (let y = currentYear - 3; y <= currentYear + 3; y++) {
      const opt = document.createElement("option");
      opt.value = String(y);
      opt.textContent = String(y);
      if (y === currentYear) opt.selected = true;
      yearSelect.appendChild(opt);
    }

    monthSelect.addEventListener("change", () => {
      subscribeToCloud();
      renderTable();
    });
    yearSelect.addEventListener("change", () => {
      subscribeToCloud();
      renderTable();
    });
  }

  function getSelectedMonth() {
    return `${yearSelect.value}-${monthSelect.value}`;
  }

  function getLocalHabits() {
    const saved = localStorage.getItem("habitNames_en_v2");
    return saved ? JSON.parse(saved) : [...DEFAULT_HABITS];
  }

  function getLocalMonthData(monthKey) {
    const saved = localStorage.getItem(`habitData_en_${monthKey}`);
    return saved ? JSON.parse(saved) : {};
  }

  async function saveHabitName(index, value) {
    const habits = getLocalHabits();
    habits[index] = value.trim() || `Habit ${index + 1}`;
    localStorage.setItem("habitNames_en_v2", JSON.stringify(habits));

    if (db && currentSyncKey) {
      try {
        await set(ref(db, `trackers/${currentSyncKey}/habits`), habits);
        setStatus(`Synced (${currentSyncKey})`);
      } catch (e) {
        setStatus("Cloud save failed (saved locally)", true);
      }
    }
  }

  async function saveMonthData(monthKey, data) {
    localStorage.setItem(`habitData_en_${monthKey}`, JSON.stringify(data));

    if (db && currentSyncKey) {
      try {
        await set(ref(db, `trackers/${currentSyncKey}/months/${monthKey}`), data);
        setStatus(`Synced (${currentSyncKey})`);
      } catch (e) {
        setStatus("Cloud save failed (saved locally)", true);
      }
    }
  }

  function subscribeToCloud() {
    if (unsubscribeHabits) {
      unsubscribeHabits();
      unsubscribeHabits = null;
    }
    if (unsubscribeMonth) {
      unsubscribeMonth();
      unsubscribeMonth = null;
    }

    if (!isFirebaseConfigured) {
      setStatus("Add firebaseConfig in code to enable cloud sync");
      return;
    }

    if (!currentSyncKey) {
      setStatus("Enter a Sync Key and click Connect & Sync");
      return;
    }

    const monthKey = getSelectedMonth();
    const habitsRef = ref(db, `trackers/${currentSyncKey}/habits`);
    const monthRef = ref(db, `trackers/${currentSyncKey}/months/${monthKey}`);

    setStatus(`Connecting (${currentSyncKey})...`);

    unsubscribeHabits = onValue(habitsRef, (snapshot) => {
      if (snapshot.exists()) {
        const cloudHabits = snapshot.val();
        if (Array.isArray(cloudHabits) && cloudHabits.length === HABIT_COUNT) {
          localStorage.setItem("habitNames_en_v2", JSON.stringify(cloudHabits));
          renderTable();
        }
      } else {
        set(habitsRef, getLocalHabits());
      }
      setStatus(`Synced (${currentSyncKey})`);
    }, () => {
      setStatus("Sync permission/network error", true);
    });

    unsubscribeMonth = onValue(monthRef, (snapshot) => {
      if (snapshot.exists()) {
        localStorage.setItem(`habitData_en_${monthKey}`, JSON.stringify(snapshot.val()));
        renderTable();
      }
    });
  }

  window.applySyncKey = function () {
    const key = syncKeyInput.value.trim();
    currentSyncKey = key;
    localStorage.setItem("habitSyncKey", key);
    subscribeToCloud();
    renderTable();
  };

  window.resetCurrentMonth = async function () {
    const monthKey = getSelectedMonth();
    const monthLabel = `${MONTH_NAMES[Number(monthSelect.value) - 1]} ${yearSelect.value}`;
    if (confirm(`Reset all checkmarks for ${monthLabel}?`)) {
      localStorage.removeItem(`habitData_en_${monthKey}`);
      if (db && currentSyncKey) {
        await remove(ref(db, `trackers/${currentSyncKey}/months/${monthKey}`));
      }
      renderTable();
    }
  };

  function renderTable() {
    const activeElement = document.activeElement;
    const focusedHabitIndex =
      activeElement && activeElement.classList.contains("habit-input")
        ? Number(activeElement.dataset.habitIndex)
        : null;
    const selectionStart = focusedHabitIndex !== null ? activeElement.selectionStart : null;
    const selectionEnd = focusedHabitIndex !== null ? activeElement.selectionEnd : null;

    const monthKey = getSelectedMonth();
    const [year, month] = monthKey.split("-").map(Number);
    const daysInMonth = new Date(year, month, 0).getDate();
    const habits = getLocalHabits();
    const monthData = getLocalMonthData(monthKey);

    headerRow.innerHTML = `<th>Date</th>`;
    habits.forEach((habit, idx) => {
      const th = document.createElement("th");
      const input = document.createElement("input");
      input.type = "text";
      input.className = "habit-input";
      input.dataset.habitIndex = String(idx);
      input.value = habit;
      input.title = "Click to edit habit name";
      input.addEventListener("change", (e) => saveHabitName(idx, e.target.value));
      th.appendChild(input);
      headerRow.appendChild(th);
    });
    const statusTh = document.createElement("th");
    statusTh.className = "status-col";
    statusTh.textContent = "Done";
    headerRow.appendChild(statusTh);

    trackerBody.innerHTML = "";
    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    for (let day = 1; day <= daysInMonth; day++) {
      const tr = document.createElement("tr");
      const dateObj = new Date(year, month - 1, day);
      const dayOfWeek = dayNames[dateObj.getDay()];

      const dateTd = document.createElement("td");
      dateTd.textContent = `${day} (${dayOfWeek})`;
      if (dateObj.getDay() === 0) dateTd.style.color = "#ef4444";
      if (dateObj.getDay() === 6) dateTd.style.color = "#3b82f6";
      tr.appendChild(dateTd);

      const dayChecks = monthData[day] || Array(HABIT_COUNT).fill(false);

      for (let h = 0; h < HABIT_COUNT; h++) {
        const td = document.createElement("td");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = !!dayChecks[h];

        checkbox.addEventListener("change", () => {
          const currentData = getLocalMonthData(monthKey);
          if (!currentData[day]) currentData[day] = Array(HABIT_COUNT).fill(false);
          currentData[day][h] = checkbox.checked;
          saveMonthData(monthKey, currentData);
          updateRowStatus(tr, currentData[day], day);
        });

        td.appendChild(checkbox);
        tr.appendChild(td);
      }

      const statusTd = document.createElement("td");
      statusTd.className = "status-col";
      tr.appendChild(statusTd);

      updateRowStatus(tr, dayChecks, day);
      trackerBody.appendChild(tr);
    }

    if (focusedHabitIndex !== null) {
      const nextInput = headerRow.querySelector(`.habit-input[data-habit-index="${focusedHabitIndex}"]`);
      if (nextInput) {
        nextInput.focus();
        if (selectionStart !== null && selectionEnd !== null) {
          nextInput.setSelectionRange(selectionStart, selectionEnd);
        }
      }
    }
  }

  function updateRowStatus(tr, dayChecks, day) {
    const statusTd = tr.lastElementChild;
    const isAllCompleted = dayChecks.length === HABIT_COUNT && dayChecks.every(Boolean);

    if (isAllCompleted) {
      tr.classList.add("completed-row");
      const emoji = CELEBRATION_EMOJIS[day % CELEBRATION_EMOJIS.length];
      statusTd.innerHTML = `<span class="emoji-pop">${emoji}</span>`;
    } else {
      tr.classList.remove("completed-row");
      statusTd.textContent = "";
    }
  }

  initMonthSelectors();
  renderTable();
  subscribeToCloud();
</script>

</body>
</html>
